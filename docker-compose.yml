services:
  familydashboard-api:
    build:
      context: .
      dockerfile: FamilyDashboard.Api/Dockerfile
    container_name: familydashboard-api
    ports:
      - "7104:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./FamilyDashboard.Api/App_Data:/app/App_Data
