<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <title>Family Dashboard</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="icon-512.png" />
    <link href="manifest.json" rel="manifest" />
    
    <link href="dist/css/site.css" rel="stylesheet" />
    <script defer src="dist/js/index.js"></script>
    <script src="https://kit.fontawesome.com/0fec51e666.js" crossorigin="anonymous"></script>
    <!--<link href="FamilyDashboard.Blazor.styles.css" rel="stylesheet" />-->
    
    <style>
        /* Dark mode scrollbar styling */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #2b2b2b;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 6px;
            border: 2px solid #2b2b2b;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }

        ::-webkit-scrollbar-thumb:active {
            background: #6a6a6a;
        }

        /* Firefox scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #4a4a4a #2b2b2b;
        }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <!-- If you want to have a linear loading bar instead of the circle, uncomment line below and comment loading-progress element above 
            <div class="linear-progress"></div> -->
        <div class="loading-progress-text"></div>
    </div>
    

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // Auto-scroll to current time indicator
        window.scrollToCurrentTime = function(containerElement, targetElement) {
            if (containerElement && targetElement) {
                // Get the position of the time indicator relative to the container
                const containerRect = containerElement.getBoundingClientRect();
                const targetRect = targetElement.getBoundingClientRect();
                
                // Calculate scroll position to center the indicator
                const scrollTop = targetRect.top - containerRect.top - (containerRect.height / 2) + (targetRect.height / 2);
                
                // Smooth scroll to position
                containerElement.scrollTo({
                    top: scrollTop,
                    behavior: 'smooth'
                });
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
